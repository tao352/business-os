name: R1.3C Format Helper

on:
  push:
    branches:
      - feat/r13c-opportunity-lifecycle
    paths:
      - packages/core/src/sales/opportunity-lifecycle.ts
      - tests/r13c-opportunity-lifecycle.test.ts
      - .github/workflows/r13c-format-helper.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r13c-opportunity-lifecycle
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/core/src/sales/opportunity-lifecycle.ts tests/r13c-opportunity-lifecycle.test.ts
      - name: Commit formatted files and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r13c-format-helper.yml
          git add packages/core/src/sales/opportunity-lifecycle.ts tests/r13c-opportunity-lifecycle.test.ts
          git commit -m "style(r13c): apply repository Prettier"
          git push origin HEAD:feat/r13c-opportunity-lifecycle
