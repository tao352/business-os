name: Prettier Debug

on:
  push:
    branches:
      - feat/r13c-opportunity-lifecycle

jobs:
  prettier-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write packages/core/src/sales/opportunity-lifecycle.ts tests/r13c-opportunity-lifecycle.test.ts
          git diff -- packages/core/src/sales/opportunity-lifecycle.ts tests/r13c-opportunity-lifecycle.test.ts
          if ! git diff --quiet -- packages/core/src/sales/opportunity-lifecycle.ts tests/r13c-opportunity-lifecycle.test.ts; then
            exit 1
          fi
