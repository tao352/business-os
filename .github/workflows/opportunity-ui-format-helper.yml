name: Opportunity UI Format Helper

on:
  push:
    branches:
      - feat/opportunity-ui
    paths:
      - apps/web/**
      - packages/core/src/sales/opportunity-read-model.ts
      - tests/opportunity-ui-read-model.test.ts
      - tests-e2e/**
      - scripts/seed-e2e.ts
      - .github/workflows/opportunity-ui-format-helper.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opportunity-ui
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write \
            "apps/web/**/*.{ts,tsx}" \
            "packages/core/src/sales/opportunity-read-model.ts" \
            "tests/opportunity-ui-read-model.test.ts" \
            "tests-e2e/*.{ts,tsx}" \
            "scripts/seed-e2e.ts"
      - name: Commit formatting and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/opportunity-ui-format-helper.yml
          git add apps/web packages/core/src/sales/opportunity-read-model.ts tests/opportunity-ui-read-model.test.ts tests-e2e scripts/seed-e2e.ts
          git commit -m "style(opportunity-ui): apply repository Prettier"
          git push origin HEAD:feat/opportunity-ui
